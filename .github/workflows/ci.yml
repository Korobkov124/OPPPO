name: Build project

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1
          
      - name: Build solution
        shell: pwsh
        run: |
          msbuild "opppo_task1/opppo_task1.sln" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:CL=/utf-8 `
            /p:UsePrecompiledHeader=false `
            /p:PrecompiledHeader=NotUsing `
            /p:PlatformToolset=v143 `
            /p:CLToolExe=cl.exe `
            /p:CLToolPath="C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\**version**\bin\Hostx64\x64" `
            /p:AdditionalOptions="/std:c++17"
