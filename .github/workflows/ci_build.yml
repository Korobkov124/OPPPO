name: Build with Tests

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build solution with tests
        shell: cmd
        run: |
          msbuild opppo_task1\opppo_task1.sln /p:Configuration=Release /p:Platform=x64 /p:AdditionalOptions="/std:c++17" /m

      - name: Run tests
        shell: cmd
        run: |
          set TEST_EXE=
          for /r %%i in (opppo_task1.tests.exe) do set TEST_EXE=%%i
          if "%TEST_EXE%"=="" (
            echo "❌ Test executable not found"
            dir /s /b *.exe
            exit 1
          )
          echo "Running tests: %TEST_EXE%"
          "%TEST_EXE%"
