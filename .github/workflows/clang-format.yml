name: Auto Format

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  clang-format:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Clang-Format
        shell: pwsh
        run: |
          choco install llvm -y
          refreshenv

      - name: Run Clang-Format
        shell: pwsh
        run: |
          $clangFormat = "C:\Program Files\LLVM\bin\clang-format.exe"
          Get-ChildItem -Path "opppo_task1" -Recurse -Include "*.cpp", "*.h" | ForEach-Object {
            & $clangFormat -i $_.FullName
          }

      - name: Commit and push formatted code
        shell: pwsh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --cached --quiet || (
              git commit -m "Apply clang-format"
              git push https://$env:GH_PAT@github.com/Korobkov124/OPPPO.git HEAD:dev
          )
