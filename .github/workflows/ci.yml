name: Build OPPPO

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1️⃣ Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Настраиваем Visual Studio 2022 (MSBuild + C++ компилятор)
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      # 3️⃣ Настраиваем переменные среды для C++ компилятора
      - name: Setup environment for MSVC
        shell: pwsh
        run: |
          $vs = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $vcvarsall = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          cmd.exe /c "`"$vcvarsall`" x64 && set" | Out-String | foreach {
            if ($_ -match "=") { $parts = $_ -split "="; echo "$($parts[0])=$($parts[1])" }
          }

      # 4️⃣ Сборка решения
      - name: Build solution
        shell: pwsh
        run: |
          msbuild "opppo_task1/opppo_task1.sln" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:CL=/utf-8 `
            /p:UsePrecompiledHeader=false `
            /p:PrecompiledHeader=NotUsing `
            /p:PlatformToolset=v143 `
            /p:CppStandard=c++17
