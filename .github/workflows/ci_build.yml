name: Build project

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build solution without tests
        shell: cmd
        run: |
          msbuild opppo_task1\opppo_task1.sln /p:Configuration=Release /p:Platform=x64 /p:AdditionalOptions="/std:c++17" /p:BuildProjectReferences=true /m

      - name: Find and run executable
        shell: cmd
        run: |
          for /r %%i in (opppo_task1.exe) do (
            echo "Found executable: %%i"
            echo "Running application..."
            "%%i"
            exit /b 0
          )
          echo "No executable found"
          dir /s /b *.exe
          exit 1
