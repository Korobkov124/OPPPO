name: Build project

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Visual Studio 2022
        uses: microsoft/setup-visualstudio@v1
        with:
          version: '17.4.4'
          include: 'Microsoft.VisualStudio.Workload.NativeDesktop'

      - name: Build solution
        shell: pwsh
        run: |
          msbuild "opppo_task1/opppo_task1.core/opppo_task1.core.vcxproj" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:CL=/utf-8 `
            /p:CppStandard=c++17 `
            /p:UsePrecompiledHeader=false `
            /p:PrecompiledHeader=NotUsing

          msbuild "opppo_task1/opppo_task1.sln" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:CL=/utf-8 `
            /p:CppStandard=c++17 `
            /p:UsePrecompiledHeader=false `
            /p:PrecompiledHeader=NotUsing
