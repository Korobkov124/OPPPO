name: Build project

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and test
        shell: cmd
        run: |
          msbuild opppo_task1\opppo_task1.sln /p:Configuration=Release /p:Platform=x64 /p:AdditionalOptions="/std:c++17"
          if exist opppo_task1\opppo_task1.tests\x64\Release\opppo_task1.tests.exe (
            opppo_task1\opppo_task1.tests\x64\Release\opppo_task1.tests.exe
          )
