name: Build project

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Add pch.h to all cpp files if missing
        shell: pwsh
        run: |
          $cppFiles = Get-ChildItem "opppo_task1" -Recurse -Filter *.cpp
      
          foreach ($file in $cppFiles) {
              $content = Get-Content $file.FullName -Raw
      
              if ($content -notmatch '(?m)^\s*#\s*include\s*"pch\.h"') {
                  Write-Host "Adding #include \"pch.h\" to $($file.FullName)"
                  $newContent = "#include `"pch.h`"" + [Environment]::NewLine + $content
                  Set-Content -Path $file.FullName -Value $newContent -Encoding UTF8
              }
          }
          
      - name: Build solution without PCH
        shell: pwsh
        run: |
          msbuild "opppo_task1/opppo_task1.sln" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:CL=/utf-8 `
            /p:UsePrecompiledHeader=false `
            /p:PrecompiledHeader=NotUsing
