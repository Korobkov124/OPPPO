name: Build project
on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main", "dev"]
jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Build solution
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          
          msbuild "opppo_task1/opppo_task1.sln" /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:CharacterSet=Unicode
