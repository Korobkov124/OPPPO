name: Build project

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build solution
        run: |
          msbuild "opppo_task1\opppo_task1.sln" ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:AdditionalOptions="/std:c++17"
