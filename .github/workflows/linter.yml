name: Code Linter

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  clang-tidy:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        
      - name: Install Clang-Tidy
        shell: pwsh
        run: |
          choco install llvm -y
          refreshenv
          
      - name: Run Clang-Tidy
        shell: pwsh
        run: |
          $ClangTidy = "C:\Program Files\LLVM\bin\clang-tidy.exe"
          if (Test-Path $ClangTidy) {
              # Получаем пути к include MSVC и Windows SDK
              $IncludePaths = "$env:VC_IncludePath;$env:WindowsSDK_IncludePath"
              
              Get-ChildItem -Path "opppo_task1" -Recurse -Include "*.cpp","*.h" | Where-Object { $_.FullName -notmatch "opppo_task1.tests" } | ForEach-Object {
                  Write-Host "Analyzing: $($_.FullName)"
                  & $ClangTidy $_.FullName -- -x c++ -std=c++17 -Iopppo_task1.core -I$IncludePaths
              }
          } else {
              Write-Host "Clang-Tidy not found, skipping linting"
          }
        continue-on-error: true
