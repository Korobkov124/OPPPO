name: Build main project

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and test main app
        shell: cmd
        run: |
          # Собираем только основные проекты
          msbuild opppo_task1\opppo_task1.core\opppo_task1.core.vcxproj /p:Configuration=Release /p:Platform=x64
          msbuild opppo_task1\opppo_task1\opppo_task1.vcxproj /p:Configuration=Release /p:Platform=x64
          
          # Проверяем что собралось
          if exist "opppo_task1\x64\Release\opppo_task1.exe" (
            echo "SUCCESS: Main application built"
            "opppo_task1\x64\Release\opppo_task1.exe"
          ) else (
            echo "FAILED: Main application not built"
            exit 1
          )
