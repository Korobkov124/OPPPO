name: Build project

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Build solution
        shell: pwsh
        run: |
          # Собираем основной проект
          msbuild "opppo_task1/opppo_task1.sln" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:CppStandard=c++17 `
            /p:UsePrecompiledHeader=false `
            /p:PrecompiledHeader=NotUsing `
            /m

      - name: Run tests (optional)
        shell: pwsh
        run: |
          $testDll = "opppo_task1/opppo_task1.tests/x64/Release/opppo_task1.tests.exe"
          if (Test-Path $testDll) {
            & $testDll
          } else {
            Write-Host "Test executable not found"
          }
